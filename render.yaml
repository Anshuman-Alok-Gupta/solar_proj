# Render Blueprint: FastAPI backend only (Docker, free plan).
# Frontend -> Vercel (frontend/), database -> Neon free Postgres.
# Secrets are `sync: false`: Render asks for them when the Blueprint is first applied and never
# reads them from this file. DATABASE_URL is the Neon connection string (postgresql://...;
# the app adds the psycopg driver itself). CORS_ORIGINS is the Vercel URL.

services:
  - type: web
    name: solar-backend
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SEMS_ACCOUNT
        sync: false
      - key: SEMS_PASSWORD
        sync: false
      - key: SEMS_SYNC_ENABLED
        value: "true"
      - key: SEMS_SYNC_INTERVAL_SECONDS
        value: "900"
      # fewer glibc malloc arenas: keeps the 512 MB free instance comfortable during training
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: WEATHER_SYNC_ENABLED
        value: "true"
      - key: LLM_PROVIDER
        value: openai_compatible
      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: LLM_MODEL
        value: gemini-3.5-flash
      - key: LLM_FALLBACK_MODELS
        value: gemini-3-flash-preview,gemini-flash-lite-latest
      - key: LLM_API_KEY
        sync: false
      - key: LLM_TOOL_MODE
        value: auto
      # Free instances have no persistent disk: model artifacts/uploads are lost on restart.
      - key: MODEL_DIR
        value: /tmp/solar/models
      - key: UPLOAD_DIR
        value: /tmp/solar/uploads
